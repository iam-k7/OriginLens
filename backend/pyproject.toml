[project]
name = "originlens-backend"
version = "0.1.0"
description = "OriginLens backend — privacy-first image and text analysis"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.4",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Cache / queue
    "redis>=5.0",
    "celery[redis]>=5.4",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "email-validator>=2.2",

    # Image / metadata
    "pillow>=10.4",
    "piexif>=1.1",
    "Pillow-SIMD>=10.4 ; sys_platform != 'win32'",
    "exifread>=3.0",
    "iptcinfo3>=2.1",
    "c2pa-python>=0.16",

    # HTTP client
    "httpx>=0.27",

    # Resilience
    "tenacity>=9.0",

    # Logging
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-passlib",
    "types-python-jose",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
