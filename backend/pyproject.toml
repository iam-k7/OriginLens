[project]
name = "originlens-api"
version = "0.1.0"
description = "OriginLens API: image metadata, provenance, privacy clean and text intelligence"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "pillow>=11.0",
    "c2pa-python>=0.10",
    "pyjwt[crypto]>=2.9",
    "defusedxml>=0.7",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "fakeredis>=2.23", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
